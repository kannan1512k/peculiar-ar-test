<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no">

  <title>Peculiar Print Hub AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* Status text */

    #message {
      position: fixed;
      top: 18px;
      left: 0;
      right: 0;

      text-align: center;

      color: white;

      font-family: Arial, sans-serif;
      font-size: 17px;
      font-weight: bold;

      z-index: 5000;

      text-shadow:
        0 2px 6px #000;
    }


    /* =========================
       FULL SCREEN VIDEO
       ========================= */

    #videoScreen {

      display: none;

      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      background: #000;

      z-index: 90000;

      align-items: center;
      justify-content: center;
    }


    #mainVideo {

      width: 100%;
      height: 100%;

      object-fit: contain;

      background: #000;
    }


    /* =========================
       SOUND BUTTON
       ========================= */

    #soundButton {

      position: absolute;

      left: 50%;
      bottom: 45px;

      transform: translateX(-50%);

      padding: 15px 28px;

      border: none;

      border-radius: 40px;

      background: white;

      color: black;

      font-family: Arial, sans-serif;

      font-size: 16px;

      font-weight: bold;

      z-index: 90010;
    }


    /* =========================
       REPLAY BUTTON
       ========================= */

    #replayButton {

      display: none;

      position: absolute;

      left: 50%;
      bottom: 45px;

      transform: translateX(-50%);

      padding: 15px 28px;

      border: none;

      border-radius: 40px;

      background: white;

      color: black;

      font-family: Arial, sans-serif;

      font-size: 16px;

      font-weight: bold;

      z-index: 90010;
    }


    /* =========================
       CLOSE BUTTON
       ========================= */

    #closeButton {

      position: absolute;

      top: 20px;
      right: 18px;

      width: 48px;
      height: 48px;

      border-radius: 50%;

      border: 1px solid white;

      background: rgba(0,0,0,0.65);

      color: white;

      font-size: 22px;

      z-index: 90010;
    }


    /* Hide VR button */

    .a-enter-vr {
      display: none !important;
    }

  </style>

</head>


<body>


  <!-- =========================
       STATUS
       ========================= -->

  <div id="message">

    📷 Starting camera...

  </div>


  <!-- =========================
       VIDEO
       ========================= -->

  <div id="videoScreen">


    <video
      id="mainVideo"
      src="./video1.mp4"
      preload="auto"
      playsinline
      webkit-playsinline
      muted>
    </video>


    <button
      id="soundButton"
      type="button">

      🔊 TAP FOR SOUND

    </button>


    <button
      id="replayButton"
      type="button">

      ▶️ PLAY AGAIN

    </button>


    <button
      id="closeButton"
      type="button">

      ✕

    </button>


  </div>


  <!-- =========================
       MINDAR
       ========================= -->

  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights;
    "

    vr-mode-ui="
      enabled: false;
    "

    device-orientation-permission-ui="
      enabled: false;
    ">


    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <a-entity
      mindar-image-target="
        targetIndex: 0;
      ">
    </a-entity>


  </a-scene>


  <!-- =========================
       JAVASCRIPT
       ========================= -->

  <script>


    const scene =
      document.querySelector("a-scene");


    const target =
      document.querySelector(
        "[mindar-image-target]"
      );


    const message =
      document.getElementById(
        "message"
      );


    const videoScreen =
      document.getElementById(
        "videoScreen"
      );


    const video =
      document.getElementById(
        "mainVideo"
      );


    const soundButton =
      document.getElementById(
        "soundButton"
      );


    const replayButton =
      document.getElementById(
        "replayButton"
      );


    const closeButton =
      document.getElementById(
        "closeButton"
      );


    /* =========================
       AR READY
       ========================= */

    scene.addEventListener(
      "arReady",
      function () {

        console.log(
          "MindAR camera ready"
        );

        message.innerHTML =
          "📷 Point your camera at the printed photo";

      }
    );


    /* =========================
       PHOTO FOUND
       ========================= */

    target.addEventListener(
      "targetFound",
      function () {

        console.log(
          "PHOTO DETECTED"
        );


        message.innerHTML =
          "🎬 VIDEO PLAYING";


        videoScreen.style.display =
          "flex";


        soundButton.style.display =
          "block";


        replayButton.style.display =
          "none";


        video.currentTime =
          0;


        /*
          Start muted because
          mobile browsers allow
          muted autoplay.
        */

        video.muted =
          true;


        video.play()
          .catch(
            function (error) {

              console.log(
                "Video autoplay:",
                error
              );

            }
          );

      }
    );


    /* =========================
       PHOTO LOST
       ========================= */

    target.addEventListener(
      "targetLost",
      function () {

        console.log(
          "PHOTO LOST"
        );


        /*
          IMPORTANT:

          DO NOT pause the video.

          Video continues even when
          camera moves away.
        */

      }
    );


    /* =========================
       SOUND
       ========================= */

    soundButton.addEventListener(
      "click",
      function () {

        video.muted =
          false;


        video.play();


        soundButton.style.display =
          "none";

      }
    );


    /* =========================
       VIDEO END
       ========================= */

    video.addEventListener(
      "ended",
      function () {

        soundButton.style.display =
          "none";


        replayButton.style.display =
          "block";

      }
    );


    /* =========================
       REPLAY
       ========================= */

    replayButton.addEventListener(
      "click",
      function () {

        video.currentTime =
          0;


        video.muted =
          false;


        video.play();


        replayButton.style.display =
          "none";

      }
    );


    /* =========================
       CLOSE
       ========================= */

    closeButton.addEventListener(
      "click",
      function () {

        video.pause();


        video.currentTime =
          0;


        video.muted =
          true;


        videoScreen.style.display =
          "none";


        soundButton.style.display =
          "block";


        replayButton.style.display =
          "none";


        message.innerHTML =
          "📷 Point your camera at the printed photo";

      }
    );


  </script>


</body>

</html>
