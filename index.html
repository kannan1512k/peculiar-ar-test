<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Camera Test</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    #camera {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #start {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);

      padding: 18px 28px;

      font-size: 20px;
      font-weight: bold;

      border: none;
      border-radius: 35px;

      background: white;
      color: black;

      z-index: 10;
    }

    #message {
      position: fixed;
      top: 20px;
      left: 0;
      right: 0;

      text-align: center;

      color: white;
      font-size: 18px;
      font-weight: bold;

      z-index: 20;

      text-shadow: 0 2px 5px black;
    }
  </style>
</head>

<body>

  <div id="message">
    Camera Test
  </div>

  <button id="start">
    📷 START CAMERA
  </button>

  <video
    id="camera"
    autoplay
    playsinline
    muted>
  </video>

  <script>

    const camera = document.getElementById("camera");
    const start = document.getElementById("start");
    const message = document.getElementById("message");

    start.addEventListener("click", async () => {

      try {

        const stream =
          await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: {
                ideal: "environment"
              }
            },
            audio: false
          });

        camera.srcObject = stream;

        start.style.display = "none";

        message.innerHTML =
          "✅ CAMERA WORKING";

      } catch (error) {

        message.innerHTML =
          "❌ CAMERA ERROR: " + error.name;

        console.log(error);

      }

    });

  </script>

</body>
</html>
