<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no">

  <title>Peculiar Print Hub AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =========================
       PREMIUM START SCREEN
       ========================= */

    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 99999;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;

      color: white;

      background:
        radial-gradient(
          circle at center,
          #252525 0%,
          #0c0c0c 45%,
          #000000 100%
        );
    }

    #startScreen h1 {
      margin: 0 0 12px;
      font-size: 30px;
      font-weight: 700;
    }

    #subtitle {
      margin: 0 25px 35px;
      color: rgba(255,255,255,0.72);
      font-size: 16px;
      line-height: 1.6;
    }

    #startButton {
      min-width: 235px;
      height: 60px;
      padding: 0 28px;

      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 40px;

      background:
        linear-gradient(
          135deg,
          #ffffff,
          #dddddd
        );

      color: #000;

      font-size: 17px;
      font-weight: 700;

      box-shadow:
        0 12px 35px rgba(0,0,0,0.55);

      touch-action: manipulation;
    }

    #startButton:active {
      transform: scale(0.96);
    }

    #startButton:disabled {
      opacity: 0.45;
    }

    #loadingText {
      margin-top: 18px;
      font-size: 13px;
      color: rgba(255,255,255,0.45);
    }

    #brand {
      position: absolute;
      bottom: 34px;

      font-size: 12px;
      letter-spacing: 2px;

      color: rgba(255,255,255,0.35);
    }

    /* =========================
       CAMERA MESSAGE
       ========================= */

    #message {
      position: fixed;

      top: 20px;
      left: 15px;
      right: 15px;

      text-align: center;

      color: white;

      font-size: 17px;
      font-weight: 600;

      z-index: 5000;

      text-shadow:
        0 2px 8px #000;
    }

    /* =========================
       VIDEO
       ========================= */

    #videoScreen {
      display: none;

      position: fixed;
      inset: 0;

      z-index: 90000;

      background: #000;

      align-items: center;
      justify-content: center;
    }

    #mainVideo {
      width: 100%;
      height: 100%;

      object-fit: contain;

      background: #000;
    }

    /* =========================
       SOUND
       ========================= */

    #soundButton {
      position: absolute;

      left: 50%;
      bottom: 45px;

      transform: translateX(-50%);

      padding: 15px 28px;

      border: none;
      border-radius: 40px;

      background: rgba(255,255,255,0.96);

      color: #000;

      font-size: 16px;
      font-weight: 700;

      z-index: 90010;
    }

    /* =========================
       REPLAY
       ========================= */

    #replayButton {
      display: none;

      position: absolute;

      left: 50%;
      bottom: 45px;

      transform: translateX(-50%);

      padding: 15px 28px;

      border: none;
      border-radius: 40px;

      background: rgba(255,255,255,0.96);

      color: #000;

      font-size: 16px;
      font-weight: 700;

      z-index: 90010;
    }

    /* =========================
       CLOSE
       ========================= */

    #closeButton {
      position: absolute;

      top: 22px;
      right: 18px;

      width: 48px;
      height: 48px;

      border-radius: 50%;

      border: 1px solid rgba(255,255,255,0.5);

      background: rgba(0,0,0,0.65);

      color: white;

      font-size: 22px;

      z-index: 90010;
    }

    .a-enter-vr {
      display: none !important;
    }

  </style>

</head>


<body>

  <!-- =========================
       PREMIUM OPENING SCREEN
       ========================= -->

  <div id="startScreen">

    <h1>📸 Peculiar AR</h1>

    <p id="subtitle">
      Scan the printed photo<br>
      to unlock its story
    </p>

    <button id="startButton" type="button" disabled>
      📷 START SCANNER
    </button>

    <div id="loadingText">
      Preparing scanner...
    </div>

    <div id="brand">
      PECULIAR PRINT HUB
    </div>

  </div>


  <!-- =========================
       STATUS
       ========================= -->

  <div id="message">
    Preparing scanner...
  </div>


  <!-- =========================
       FULL SCREEN VIDEO
       ========================= -->

  <div id="videoScreen">

    <video
      id="mainVideo"
      src="./video1.mp4"
      preload="auto"
      playsinline
      webkit-playsinline
      muted>
    </video>

    <button id="soundButton" type="button">
      🔊 TAP FOR SOUND
    </button>

    <button id="replayButton" type="button">
      ▶️ PLAY AGAIN
    </button>

    <button id="closeButton" type="button">
      ✕
    </button>

  </div>


  <!-- =========================
       MINDAR
       ========================= -->

  <a-scene
    id="arScene"

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false">


    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <a-entity
      id="photoTarget"
      mindar-image-target="targetIndex: 0">
    </a-entity>


  </a-scene>


  <!-- =========================
       JAVASCRIPT
       ========================= -->

  <script>

    const scene =
      document.getElementById("arScene");

    const startScreen =
      document.getElementById("startScreen");

    const startButton =
      document.getElementById("startButton");

    const loadingText =
      document.getElementById("loadingText");

    const message =
      document.getElementById("message");

    const target =
      document.getElementById("photoTarget");

    const videoScreen =
      document.getElementById("videoScreen");

    const video =
      document.getElementById("mainVideo");

    const soundButton =
      document.getElementById("soundButton");

    const replayButton =
      document.getElementById("replayButton");

    const closeButton =
      document.getElementById("closeButton");


    /* =========================
       MINDAR READY
       ========================= */

    scene.addEventListener(
      "arReady",
      function () {

        console.log("MindAR ready");

        loadingText.textContent =
          "Scanner ready";

        message.textContent =
          "📷 Ready to scan";

        startButton.disabled = false;

      }
    );


    /* =========================
       MINDAR ERROR
       ========================= */

    scene.addEventListener(
      "arError",
      function (event) {

        console.error(
          "MindAR error:",
          event
        );

        loadingText.textContent =
          "Camera error";

        message.textContent =
          "⚠️ Camera could not start";

      }
    );


    /* =========================
       START SCANNER BUTTON
       ========================= */

    startButton.addEventListener(
      "click",
      function () {

        console.log(
          "START SCANNER clicked"
        );

        startScreen.style.display =
          "none";

        message.textContent =
          "📷 Point your camera at the printed photo";

      }
    );


    /* =========================
       PHOTO FOUND
       ========================= */

    target.addEventListener(
      "targetFound",
      function () {

        console.log(
          "PHOTO DETECTED"
        );

        message.textContent =
          "🎬 VIDEO PLAYING";

        videoScreen.style.display =
          "flex";

        soundButton.style.display =
          "block";

        replayButton.style.display =
          "none";

        video.currentTime = 0;

        video.muted = true;

        video.play().catch(
          function (error) {

            console.log(
              "Autoplay waiting:",
              error
            );

          }
        );

      }
    );


    /* =========================
       PHOTO LOST
       ========================= */

    target.addEventListener(
      "targetLost",
      function () {

        console.log(
          "PHOTO LOST"
        );

        /*
          DO NOT pause video.

          Video continues playing even
          after camera moves away from
          the printed photo.
        */

      }
    );


    /* =========================
       SOUND
       ========================= */

    soundButton.addEventListener(
      "click",
      function () {

        video.muted = false;

        video.play();

        soundButton.style.display =
          "none";

      }
    );


    /* =========================
       VIDEO FINISHED
       ========================= */

    video.addEventListener(
      "ended",
      function () {

        soundButton.style.display =
          "none";

        replayButton.style.display =
          "block";

      }
    );


    /* =========================
       REPLAY
       ========================= */

    replayButton.addEventListener(
      "click",
      function () {

        video.currentTime = 0;

        video.muted = false;

        video.play();

        replayButton.style.display =
          "none";

      }
    );


    /* =========================
       CLOSE VIDEO
       ========================= */

    closeButton.addEventListener(
      "click",
      function () {

        video.pause();

        video.currentTime = 0;

        video.muted = true;

        videoScreen.style.display =
          "none";

        soundButton.style.display =
          "block";

        replayButton.style.display =
          "none";

        message.textContent =
          "📷 Point your camera at the printed photo";

      }
    );

  </script>

</body>

</html>
