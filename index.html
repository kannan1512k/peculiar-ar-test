<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no">

  <title>Peculiar Print Hub AR</title>


  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>


  <!-- MINDAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #000;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }


    /* =================================
       PREMIUM START SCREEN
       ================================= */

    #startScreen {

      position: fixed;

      inset: 0;

      z-index: 99999;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;

      color: white;

      background:
        radial-gradient(
          circle at center,
          #242424 0%,
          #0b0b0b 45%,
          #000000 100%
        );
    }


    #startScreen h1 {

      margin: 0 0 12px;

      font-size: 30px;

      font-weight: 700;

      letter-spacing: 0.3px;
    }


    #startScreen .subtitle {

      margin:

        0 25px 36px;

      color:

        rgba(
          255,
          255,
          255,
          0.72
        );

      font-size: 16px;

      line-height: 1.6;
    }


    /* =================================
       START BUTTON
       ================================= */

    #startButton {

      min-width: 235px;

      height: 60px;

      padding: 0 28px;

      border: 1px solid
        rgba(
          255,
          255,
          255,
          0.35
        );

      border-radius: 40px;

      background:
        linear-gradient(
          135deg,
          #ffffff,
          #dedede
        );

      color: #000;

      font-size: 17px;

      font-weight: 700;

      box-shadow:
        0 12px 35px
        rgba(
          0,
          0,
          0,
          0.55
        );

      cursor: pointer;

      touch-action: manipulation;

      transition:
        transform 0.15s ease,
        opacity 0.2s ease;
    }


    #startButton:active {

      transform:
        scale(0.96);
    }


    #startButton:disabled {

      opacity: 0.45;

      cursor: default;
    }


    /* =================================
       LOADING TEXT
       ================================= */

    #loadingText {

      margin-top: 18px;

      font-size: 13px;

      color:
        rgba(
          255,
          255,
          255,
          0.45
        );
    }


    /* =================================
       BRAND
       ================================= */

    #brand {

      position: absolute;

      bottom: 34px;

      font-size: 12px;

      letter-spacing: 2px;

      color:
        rgba(
          255,
          255,
          255,
          0.35
        );
    }


    /* =================================
       CAMERA STATUS
       ================================= */

    #message {

      position: fixed;

      top: 20px;

      left: 15px;

      right: 15px;

      text-align: center;

      color: white;

      font-size: 17px;

      font-weight: 600;

      z-index: 5000;

      text-shadow:
        0 2px 8px #000;
    }


    /* =================================
       FULL SCREEN VIDEO
       ================================= */

    #videoScreen {

      display: none;

      position: fixed;

      inset: 0;

      z-index: 90000;

      background: #000;

      align-items: center;

      justify-content: center;
    }


    #mainVideo {

      width: 100%;

      height: 100%;

      object-fit: contain;

      background: #000;

      display: block;
    }


    /* =================================
       SOUND BUTTON
       ================================= */

    #soundButton {

      position: absolute;

      left: 50%;

      bottom: 45px;

      transform:
        translateX(-50%);

      padding:
        15px 28px;

      border: none;

      border-radius: 40px;

      background:
        rgba(
          255,
          255,
          255,
          0.96
        );

      color: #000;

      font-size: 16px;

      font-weight: 700;

      box-shadow:
        0 8px 30px
        rgba(
          0,
          0,
          0,
          0.5
        );

      z-index: 90010;

      touch-action: manipulation;
    }


    /* =================================
       REPLAY BUTTON
       ================================= */

    #replayButton {

      display: none;

      position: absolute;

      left: 50%;

      bottom: 45px;

      transform:
        translateX(-50%);

      padding:
        15px 28px;

      border: none;

      border-radius: 40px;

      background:
        rgba(
          255,
          255,
          255,
          0.96
        );

      color: #000;

      font-size: 16px;

      font-weight: 700;

      box-shadow:
        0 8px 30px
        rgba(
          0,
          0,
          0,
          0.5
        );

      z-index: 90010;

      touch-action: manipulation;
    }


    /* =================================
       CLOSE BUTTON
       ================================= */

    #closeButton {

      position: absolute;

      top: 22px;

      right: 18px;

      width: 48px;

      height: 48px;

      border-radius: 50%;

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.5
        );

      background:
        rgba(
          0,
          0,
          0,
          0.65
        );

      color: white;

      font-size: 22px;

      z-index: 90010;

      touch-action: manipulation;
    }


    /* =================================
       ERROR BOX
       ================================= */

    #errorBox {

      display: none;

      position: fixed;

      left: 15px;

      right: 15px;

      bottom: 25px;

      padding: 16px;

      background:
        rgba(
          130,
          0,
          0,
          0.95
        );

      color: white;

      border-radius: 14px;

      font-size: 13px;

      line-height: 1.5;

      z-index: 999999;

      text-align: center;
    }


    /* Hide A-Frame VR button */

    .a-enter-vr {

      display: none !important;
    }

  </style>

</head>


<body>


  <!-- =================================
       PREMIUM START SCREEN
       ================================= -->

  <div id="startScreen">

    <h1>
      📸 Peculiar AR
    </h1>


    <p class="subtitle">

      Scan the printed photo<br>

      to unlock its story

    </p>


    <button
      id="startButton"
      type="button"
      disabled>

      📷 START SCANNER

    </button>


    <div id="loadingText">

      Preparing scanner...

    </div>


    <div id="brand">

      PECULIAR PRINT HUB

    </div>

  </div>



  <!-- =================================
       CAMERA MESSAGE
       ================================= -->

  <div id="message">

    Preparing scanner...

  </div>



  <!-- =================================
       ERROR
       ================================= -->

  <div id="errorBox"></div>



  <!-- =================================
       VIDEO SCREEN
       ================================= -->

  <div id="videoScreen">


    <video
      id="mainVideo"
      src="./video1.mp4"
      preload="auto"
      playsinline
      webkit-playsinline
      muted>
    </video>


    <button
      id="soundButton"
      type="button">

      🔊 TAP FOR SOUND

    </button>


    <button
      id="replayButton"
      type="button">

      ▶️ PLAY AGAIN

    </button>


    <button
      id="closeButton"
      type="button">

      ✕

    </button>


  </div>



  <!-- =================================
       MINDAR SCENE
       ================================= -->

  <a-scene

    id="arScene"

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights;
    "

    vr-mode-ui="
      enabled: false;
    "

    device-orientation-permission-ui="
      enabled: false;
    ">


    <a-camera

      position="0 0 0"

      look-controls="
        enabled: false;
      ">

    </a-camera>


    <a-entity

      id="photoTarget"

      mindar-image-target="
        targetIndex: 0;
      ">

    </a-entity>


  </a-scene>



  <!-- =================================
       JAVASCRIPT
       ================================= -->

  <script>


    document.addEventListener(
      "DOMContentLoaded",
      function () {


        /* =============================
           ELEMENTS
           ============================= */

        const scene =
          document.getElementById(
            "arScene"
          );


        const startScreen =
          document.getElementById(
            "startScreen"
          );


        const startButton =
          document.getElementById(
            "startButton"
          );


        const loadingText =
          document.getElementById(
            "loadingText"
          );


        const message =
          document.getElementById(
            "message"
          );


        const target =
          document.getElementById(
            "photoTarget"
          );


        const videoScreen =
          document.getElementById(
            "videoScreen"
          );


        const video =
          document.getElementById(
            "mainVideo"
          );


        const soundButton =
          document.getElementById(
            "soundButton"
          );


        const replayButton =
          document.getElementById(
            "replayButton"
          );


        const closeButton =
          document.getElementById(
            "closeButton"
          );


        const errorBox =
          document.getElementById(
            "errorBox"
          );



        /* =============================
           VARIABLES
           ============================= */

        let arSystem = null;

        let scannerReady = false;

        let scannerStarting = false;



        /* =============================
           FIND MINDAR SYSTEM
           ============================= */

        function checkMindAR() {


          if (arSystem) {

            return true;

          }


          if (
            scene.systems &&
            scene.systems[
              "mindar-image-system"
            ]
          ) {

            arSystem =
              scene.systems[
                "mindar-image-system"
              ];

            console.log(
              "MindAR system found"
            );


            scannerReady = true;


            startButton.disabled =
              false;


            loadingText.innerHTML =
              "Scanner ready";


            message.innerHTML =
              "Ready to scan";


            return true;

          }


          return false;

        }



        /* =============================
           WAIT FOR MINDAR
           ============================= */

        const systemChecker =
          setInterval(
            function () {


              if (
                checkMindAR()
              ) {

                clearInterval(
                  systemChecker
                );

              }


            },
            200
          );



        /* =============================
           A-FRAME LOADED
           ============================= */

        scene.addEventListener(
          "loaded",
          function () {


            console.log(
              "A-Frame loaded"
            );


            checkMindAR();


          }
        );



        /* =============================
           ERROR FUNCTION
           ============================= */

        function showError(
          text
        ) {


          console.error(
            text
          );


          errorBox.innerHTML =
            "⚠️ " + text;


          errorBox.style.display =
            "block";


        }



        /* =============================
           START SCANNER
           ============================= */

        startButton.addEventListener(
          "click",
          function () {


            errorBox.style.display =
              "none";


            if (
              scannerStarting
            ) {

              return;

            }


            if (
              !checkMindAR()
            ) {


              loadingText.innerHTML =
                "⏳ Preparing scanner...";


              return;

            }


            scannerStarting =
              true;


            startButton.disabled =
              true;


            startButton.innerHTML =
              "⏳ STARTING...";


            loadingText.innerHTML =
              "Opening camera...";


            message.innerHTML =
              "📷 Starting camera...";


            console.log(
              "Starting MindAR..."
            );


            try {


              arSystem.start();


            }
            catch (error) {


              console.error(
                "START ERROR:",
                error
              );


              scannerStarting =
                false;


              startButton.disabled =
                false;


              startButton.innerHTML =
                "📷 START SCANNER";


              loadingText.innerHTML =
                "Scanner ready";


              showError(
                "Camera start error: " +
                (
                  error.message ||
                  error
                )
              );


            }


          }
        );



        /* =============================
           AR READY
           ============================= */

        scene.addEventListener(
          "arReady",
          function () {


            console.log(
              "MindAR READY"
            );


            scannerStarting =
              false;


            startScreen.style.display =
              "none";


            message.innerHTML =
              "📷 Point your camera at the printed photo";


          }
        );



        /* =============================
           AR ERROR
           ============================= */

        scene.addEventListener(
          "arError",
          function (event) {


            console.error(
              "MindAR ERROR:",
              event
            );


            scannerStarting =
              false;


            startButton.disabled =
              false;


            startButton.innerHTML =
              "📷 START SCANNER";


            loadingText.innerHTML =
              "Scanner ready";


            showError(
              "MindAR could not start the camera. Please check browser camera permission."
            );


          }
        );



        /* =============================
           PHOTO FOUND
           ============================= */

        target.addEventListener(
          "targetFound",
          function () {


            console.log(
              "PHOTO FOUND"
            );


            message.innerHTML =
              "🎬 VIDEO PLAYING";


            videoScreen.style.display =
              "flex";


            soundButton.style.display =
              "block";


            replayButton.style.display =
              "none";


            video.currentTime =
              0;


            video.muted =
              true;


            video.play()
              .then(
                function () {


                  console.log(
                    "VIDEO PLAYING"
                  );


                }
              )
              .catch(
                function (error) {


                  console.log(
                    "Autoplay waiting:",
                    error
                  );


                }
              );


          }
        );



        /* =============================
           PHOTO LOST
           ============================= */

        target.addEventListener(
          "targetLost",
          function () {


            console.log(
              "PHOTO LOST"
            );


            /*
              IMPORTANT:

              Do NOT pause video.

              Video continues even if
              camera moves away.
            */


          }
        );



        /* =============================
           SOUND
           ============================= */

        soundButton.addEventListener(
          "click",
          function () {


            video.muted =
              false;


            video.play();


            soundButton.style.display =
              "none";


          }
        );



        /* =============================
           VIDEO END
           ============================= */

        video.addEventListener(
          "ended",
          function () {


            console.log(
              "VIDEO ENDED"
            );


            soundButton.style.display =
              "none";


            replayButton.style.display =
              "block";


          }
        );



        /* =============================
           REPLAY
           ============================= */

        replayButton.addEventListener(
          "click",
          function () {


            video.currentTime =
              0;


            video.muted =
              false;


            video.play();


            replayButton.style.display =
              "none";


          }
        );



        /* =============================
           CLOSE VIDEO
           ============================= */

        closeButton.addEventListener(
          "click",
          function () {


            video.pause();


            video.currentTime =
              0;


            video.muted =
              true;


            videoScreen.style.display =
              "none";


            soundButton.style.display =
              "block";


            replayButton.style.display =
              "none";


            message.innerHTML =
              "📷 Point your camera at the printed photo";


          }
        );


      }
    );

  </script>


</body>

</html>
