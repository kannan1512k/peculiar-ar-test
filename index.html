<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Peculiar Print Hub AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    /* START SCREEN */

    #startScreen {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 2000;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      color: white;
      text-align: center;
    }

    #startScreen h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    #startScreen p {
      font-size: 16px;
      opacity: 0.8;
      margin-bottom: 30px;
    }

    #startButton {
      border: none;
      border-radius: 40px;

      padding: 17px 32px;

      background: white;
      color: black;

      font-size: 19px;
      font-weight: bold;
    }

    /* SCANNER MESSAGE */

    #message {
      position: fixed;

      top: 20px;
      left: 0;
      right: 0;

      text-align: center;

      color: white;

      font-size: 18px;
      font-weight: bold;

      z-index: 100;

      text-shadow: 0 2px 5px black;
    }

    /* VIDEO SCREEN */

    #videoScreen {
      display: none;

      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      background: black;

      z-index: 1500;

      align-items: center;
      justify-content: center;
    }

    #mainVideo {

      width: 100%;
      height: 100%;

      object-fit: contain;

      background: black;
    }

    /* SOUND BUTTON */

    #soundButton {

      position: absolute;

      bottom: 45px;
      left: 50%;

      transform: translateX(-50%);

      border: none;

      border-radius: 35px;

      padding: 15px 25px;

      background: white;
      color: black;

      font-size: 17px;
      font-weight: bold;

      z-index: 1600;
    }

    /* REPLAY */

    #replayButton {

      display: none;

      position: absolute;

      bottom: 45px;
      left: 50%;

      transform: translateX(-50%);

      border: none;

      border-radius: 35px;

      padding: 15px 25px;

      background: white;
      color: black;

      font-size: 17px;
      font-weight: bold;

      z-index: 1600;
    }

    /* CLOSE */

    #closeButton {

      position: absolute;

      top: 25px;
      right: 20px;

      width: 46px;
      height: 46px;

      border-radius: 50%;

      border: 1px solid white;

      background: rgba(0,0,0,0.7);

      color: white;

      font-size: 22px;

      z-index: 1600;
    }

  </style>

</head>


<body>


  <!-- START SCREEN -->

  <div id="startScreen">

    <h1>📸 Peculiar AR</h1>

    <p>
      Scan the printed photo<br>
      to watch the related video
    </p>

    <button id="startButton">
      📷 START SCANNER
    </button>

  </div>


  <!-- SCANNER MESSAGE -->

  <div id="message">
    Point your camera at the printed photo
  </div>


  <!-- FULL SCREEN VIDEO -->

  <div id="videoScreen">

    <video
      id="mainVideo"
      src="./video1.mp4"
      preload="auto"
      playsinline
      webkit-playsinline
      muted>
    </video>


    <button id="soundButton">
      🔊 TAP FOR SOUND
    </button>


    <button id="replayButton">
      ▶️ PLAY AGAIN
    </button>


    <button id="closeButton">
      ✕
    </button>

  </div>


  <!-- MINDAR -->

  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      mindar-image-target="targetIndex: 0">
    </a-entity>

  </a-scene>


  <script>

    const scene =
      document.querySelector("a-scene");

    const startScreen =
      document.getElementById("startScreen");

    const startButton =
      document.getElementById("startButton");

    const message =
      document.getElementById("message");

    const target =
      document.querySelector(
        "[mindar-image-target]"
      );

    const videoScreen =
      document.getElementById("videoScreen");

    const video =
      document.getElementById("mainVideo");

    const soundButton =
      document.getElementById("soundButton");

    const replayButton =
      document.getElementById("replayButton");

    const closeButton =
      document.getElementById("closeButton");


    /*
      START SCANNER
    */

    startButton.addEventListener(
      "click",
      async () => {

        try {

          startScreen.style.display =
            "none";

          message.innerHTML =
            "📷 Point your camera at the printed photo";

          const mindarSystem =
            scene.systems["mindar-image"];

          await mindarSystem.start();

        } catch (error) {

          console.log(error);

          startScreen.style.display =
            "flex";

          message.innerHTML =
            "Camera could not start";

        }

      }
    );


    /*
      PHOTO DETECTED
    */

    target.addEventListener(
      "targetFound",
      () => {

        message.innerHTML =
          "🎬 VIDEO PLAYING";

        videoScreen.style.display =
          "flex";

        soundButton.style.display =
          "block";

        replayButton.style.display =
          "none";

        video.currentTime = 0;

        /*
          Start muted because
          mobile browsers restrict
          autoplay with sound.
        */

        video.muted = true;

        video.play().catch(
          error => {
            console.log(
              "Autoplay:",
              error
            );
          }
        );

      }
    );


    /*
      IMPORTANT:

      Photo camera-வில் இருந்து
      மறைந்தாலும் video STOP ஆகாது.
    */

    target.addEventListener(
      "targetLost",
      () => {

        message.innerHTML = "";

        /*
          DO NOT pause video.
        */

      }
    );


    /*
      SOUND ON
    */

    soundButton.addEventListener(
      "click",
      () => {

        video.muted = false;

        video.play();

        soundButton.style.display =
          "none";

      }
    );


    /*
      VIDEO FINISHED
    */

    video.addEventListener(
      "ended",
      () => {

        soundButton.style.display =
          "none";

        replayButton.style.display =
          "block";

      }
    );


    /*
      REPLAY
    */

    replayButton.addEventListener(
      "click",
      () => {

        video.currentTime = 0;

        video.muted = false;

        video.play();

        replayButton.style.display =
          "none";

      }
    );


    /*
      CLOSE VIDEO
    */

    closeButton.addEventListener(
      "click",
      () => {

        video.pause();

        video.currentTime = 0;

        video.muted = true;

        videoScreen.style.display =
          "none";

        soundButton.style.display =
          "block";

        replayButton.style.display =
          "none";

        message.innerHTML =
          "📷 Point your camera at the printed photo";

      }
    );

  </script>

</body>

</html>
