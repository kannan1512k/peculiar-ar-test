<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Peculiar Print Hub AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #startScreen {
      position: fixed;
      inset: 0;

      background: #000;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;
      color: white;

      z-index: 99999;
    }

    #startScreen h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    #startScreen p {
      font-size: 16px;
      line-height: 1.5;
      opacity: 0.8;
      margin-bottom: 30px;
    }

    #startButton {
      min-width: 220px;
      min-height: 55px;

      border: none;
      border-radius: 35px;

      background: white;
      color: black;

      font-size: 18px;
      font-weight: bold;

      touch-action: manipulation;
    }

    #message {
      position: fixed;

      top: 20px;
      left: 0;
      right: 0;

      text-align: center;

      color: white;

      font-size: 18px;
      font-weight: bold;

      z-index: 5000;

      text-shadow: 0 2px 5px black;
    }

    #videoScreen {
      display: none;

      position: fixed;
      inset: 0;

      background: black;

      z-index: 90000;

      align-items: center;
      justify-content: center;
    }

    #mainVideo {
      width: 100%;
      height: 100%;

      object-fit: contain;

      background: black;
    }

    #soundButton {
      position: absolute;

      left: 50%;
      bottom: 45px;

      transform: translateX(-50%);

      padding: 15px 25px;

      border: none;
      border-radius: 35px;

      background: white;
      color: black;

      font-size: 17px;
      font-weight: bold;

      z-index: 90010;
    }

    #replayButton {
      display: none;

      position: absolute;

      left: 50%;
      bottom: 45px;

      transform: translateX(-50%);

      padding: 15px 25px;

      border: none;
      border-radius: 35px;

      background: white;
      color: black;

      font-size: 17px;
      font-weight: bold;

      z-index: 90010;
    }

    #closeButton {
      position: absolute;

      top: 25px;
      right: 20px;

      width: 46px;
      height: 46px;

      border-radius: 50%;

      border: 1px solid white;

      background: rgba(0,0,0,0.7);

      color: white;

      font-size: 22px;

      z-index: 90010;
    }

  </style>

</head>


<body>


  <!-- START -->

  <div id="startScreen">

    <h1>📸 Peculiar AR</h1>

    <p>
      Scan the printed photo<br>
      to watch its related video
    </p>

    <button id="startButton" type="button">
      📷 START SCANNER
    </button>

  </div>


  <!-- MESSAGE -->

  <div id="message">
    Point your camera at the printed photo
  </div>


  <!-- VIDEO -->

  <div id="videoScreen">

    <video
      id="mainVideo"
      src="./video1.mp4"
      preload="auto"
      playsinline
      webkit-playsinline
      muted>
    </video>

    <button id="soundButton" type="button">
      🔊 TAP FOR SOUND
    </button>

    <button id="replayButton" type="button">
      ▶️ PLAY AGAIN
    </button>

    <button id="closeButton" type="button">
      ✕
    </button>

  </div>


  <!-- MINDAR -->

  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false">


    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <a-entity
      mindar-image-target="targetIndex: 0">
    </a-entity>


  </a-scene>


  <script>

    const scene =
      document.querySelector("a-scene");

    const startScreen =
      document.getElementById("startScreen");

    const startButton =
      document.getElementById("startButton");

    const message =
      document.getElementById("message");

    const target =
      document.querySelector(
        "[mindar-image-target]"
      );

    const videoScreen =
      document.getElementById("videoScreen");

    const video =
      document.getElementById("mainVideo");

    const soundButton =
      document.getElementById("soundButton");

    const replayButton =
      document.getElementById("replayButton");

    const closeButton =
      document.getElementById("closeButton");


    /*
      START SCANNER

      Camera permission + MindAR
      are handled by MindAR itself.
    */

    startButton.addEventListener(
      "click",
      function () {

        startButton.disabled = true;

        message.innerHTML =
          "📷 Starting camera...";


        const arSystem =
          scene.systems["mindar-image-system"];


        if (!arSystem) {

          alert(
            "MindAR system is not ready."
          );

          startButton.disabled = false;

          return;

        }


        try {

          arSystem.start();

        } catch (error) {

          console.error(error);

          alert(
            "Camera could not start."
          );

          startButton.disabled = false;

        }

      }
    );


    /*
      MindAR READY
    */

    scene.addEventListener(
      "arReady",
      function () {

        startScreen.style.display =
          "none";

        message.innerHTML =
          "📷 Point your camera at the printed photo";

      }
    );


    /*
      PHOTO FOUND
    */

    target.addEventListener(
      "targetFound",
      function () {

        message.innerHTML =
          "🎬 VIDEO PLAYING";


        videoScreen.style.display =
          "flex";


        soundButton.style.display =
          "block";


        replayButton.style.display =
          "none";


        video.currentTime = 0;

        video.muted = true;


        video.play().catch(
          error => {

            console.log(
              "Video autoplay:",
              error
            );

          }
        );

      }
    );


    /*
      PHOTO LOST

      Video MUST continue.
    */

    target.addEventListener(
      "targetLost",
      function () {

        message.innerHTML = "";

      }
    );


    /*
      SOUND
    */

    soundButton.addEventListener(
      "click",
      function () {

        video.muted = false;

        video.play();

        soundButton.style.display =
          "none";

      }
    );


    /*
      VIDEO FINISHED
    */

    video.addEventListener(
      "ended",
      function () {

        soundButton.style.display =
          "none";

        replayButton.style.display =
          "block";

      }
    );


    /*
      REPLAY
    */

    replayButton.addEventListener(
      "click",
      function () {

        video.currentTime = 0;

        video.muted = false;

        video.play();

        replayButton.style.display =
          "none";

      }
    );


    /*
      CLOSE
    */

    closeButton.addEventListener(
      "click",
      function () {

        video.pause();

        video.currentTime = 0;

        video.muted = true;

        videoScreen.style.display =
          "none";

        soundButton.style.display =
          "block";

        replayButton.style.display =
          "none";

        message.innerHTML =
          "📷 Point your camera at the printed photo";

      }
    );

  </script>

</body>

</html>
