<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Peculiar AR Test</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #message {
      position: fixed;

      top: 25px;
      left: 0;
      right: 0;

      text-align: center;

      color: white;

      font-family: Arial, sans-serif;

      font-size: 20px;

      font-weight: bold;

      z-index: 9999;

      text-shadow:
        0 2px 5px #000;
    }

  </style>

</head>


<body>

  <div id="message">
    📷 Starting camera...
  </div>


  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
    "

    vr-mode-ui="
      enabled: false;
    "

    device-orientation-permission-ui="
      enabled: false;
    ">


    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <a-entity
      mindar-image-target="targetIndex: 0">
    </a-entity>


  </a-scene>


  <script>

    const scene =
      document.querySelector("a-scene");


    const target =
      document.querySelector(
        "[mindar-image-target]"
      );


    const message =
      document.getElementById(
        "message"
      );


    /* =========================
       CAMERA READY
       ========================= */

    scene.addEventListener(
      "arReady",
      function () {

        console.log(
          "CAMERA READY"
        );

        message.innerHTML =
          "📷 Point camera at the printed photo";

      }
    );


    /* =========================
       PHOTO DETECTED
       ========================= */

    target.addEventListener(
      "targetFound",
      function () {

        console.log(
          "PHOTO DETECTED"
        );

        message.innerHTML =
          "✅ PHOTO DETECTED!";

      }
    );


    /* =========================
       PHOTO LOST
       ========================= */

    target.addEventListener(
      "targetLost",
      function () {

        console.log(
          "PHOTO LOST"
        );

        message.innerHTML =
          "📷 Point camera at the printed photo";

      }
    );

  </script>

</body>

</html>
